<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samay - Login</title>
  <meta name="description" content="CA Firm Timesheet Management System - Login">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/revamp.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">CA</div>
      <div class="login-title">Samay</div>
      <div class="login-subtitle">Practice Time Management System</div>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username or email</label>
        <input class="form-control" type="text" id="username" placeholder="Enter your username or email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <div id="login-error" style="color:var(--danger);font-size:13px;margin-bottom:12px;display:none;background:var(--danger-bg);padding:8px 12px;border-radius:6px;border:1px solid #fecaca;"></div>
      <button class="btn btn-primary" type="submit" id="login-btn" style="width:100%;justify-content:center;padding:11px;">Sign In</button>
    </form>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);text-align:center;">
      Sign in with your username or email and password.
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  const existingUser = getUser();
  const existingTarget = getDefaultLandingPage();
  if (!hasUsableSession() && (getToken() || existingUser)) clearSession();
  if (hasUsableSession() && existingTarget !== '/') window.location.replace(existingTarget);

  const loginForm = document.getElementById('login-form');
  const loginButton = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');

  function setLoginError(message) {
    loginError.textContent = message || '';
    loginError.style.display = message ? 'block' : 'none';
  }

  const authNotice = consumeAuthNotice();
  if (authNotice) setLoginError(authNotice);

  loginForm.addEventListener('submit', async event => {
    event.preventDefault();
    setLoginError('');
    loginButton.disabled = true;
    loginButton.textContent = 'Signing in...';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Unable to sign in');
      if (!data.token || !data.user) throw new Error('Login response was incomplete');

      setSession(data.token, data.user);
      window.location.replace(getDefaultLandingPage());
    } catch (error) {
      setLoginError(error.message);
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
