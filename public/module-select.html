<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Workspace - Samay</title>
  <link rel="icon" href="/icons/samay-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/revamp.css">
  <meta name="theme-color" content="#0F766E">
</head>
<body class="workspace-picker-page">
<main class="workspace-picker-shell" id="main-content">
  <header class="workspace-picker-header">
    <a class="workspace-picker-brand" href="/module-select.html" aria-label="Samay home">
      <img src="/icons/samay-icon.svg" alt="" width="44" height="44">
      <span><strong>Samay</strong><small>Practice management</small></span>
    </a>
    <div class="workspace-picker-account">
      <span id="workspace-user-name">Your account</span>
      <a class="btn btn-ghost btn-sm" href="/firm-dashboard.html" id="firm-control-link">Firm control</a>
      <button class="btn btn-ghost btn-sm" type="button" onclick="logout()">Sign out</button>
    </div>
  </header>

  <section class="workspace-picker-card page-fade-in" aria-labelledby="workspace-title">
    <div class="workspace-picker-intro">
      <div class="workspace-picker-kicker">Choose your workspace</div>
      <h1 id="workspace-title">What are you working on?</h1>
      <p>Open the area you need. Samay will remember your choice for this session.</p>
      <div class="workspace-picker-graphic" aria-hidden="true">
        <div class="workspace-graphic-orbit orbit-one"></div>
        <div class="workspace-graphic-orbit orbit-two"></div>
        <img src="/icons/samay-icon.svg" alt="" width="112" height="112">
        <span class="workspace-graphic-node node-time">Time</span>
        <span class="workspace-graphic-node node-udin">UDIN</span>
        <span class="workspace-graphic-node node-form">15CB</span>
      </div>
      <div class="workspace-picker-tip"><strong>Simple by design.</strong> Daily work, compliance, and conversion stay separate so each workspace remains focused.</div>
    </div>

    <div class="workspace-options" role="list" aria-label="Available workspaces">
      <button class="workspace-option workspace-option-primary" type="button" data-module="timesheet" role="listitem">
        <span class="workspace-option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.5 2"/></svg>
        </span>
        <span class="workspace-option-copy"><strong>Timesheet & attendance</strong><small>Log work, submit timesheets, review approvals, and understand team capacity.</small><span class="workspace-option-meta">Daily workspace</span></span>
        <span class="workspace-option-arrow" aria-hidden="true">→</span>
      </button>

      <button class="workspace-option" type="button" data-module="udin-tracker" role="listitem">
        <span class="workspace-option-icon workspace-option-icon-orange" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3.5h8l4 4v13H7Z"/><path d="M15 3.5v4h4M10 12h6M10 16h6"/></svg>
        </span>
        <span class="workspace-option-copy"><strong>UDIN tracker</strong><small>Create and review UDIN requests, signed copies, updates, and revocations.</small><span class="workspace-option-meta">Compliance workflow</span></span>
        <span class="workspace-option-arrow" aria-hidden="true">→</span>
      </button>

      <button class="workspace-option" type="button" data-module="form15cb" role="listitem">
        <span class="workspace-option-icon workspace-option-icon-blue" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7h13M14 4l3 3-3 3M20 17H7M10 14l-3 3 3 3"/></svg>
        </span>
        <span class="workspace-option-copy"><strong>Form 15CB converter</strong><small>Convert XML to Form 146 JSON, validate details, and reuse trusted master data.</small><span class="workspace-option-meta">Conversion workspace</span></span>
        <span class="workspace-option-arrow" aria-hidden="true">→</span>
      </button>
    </div>
  </section>
</main>

<script src="/js/app.js?v=15"></script>
<script>
if (!requireAuth()) {
  window.stop();
} else {
  const user = getUser();
  document.getElementById('workspace-user-name').textContent = safeUserName(user);
  document.getElementById('firm-control-link').hidden = !hasPermission('firm.dashboard.view');

  document.querySelectorAll('[data-module]').forEach(option => {
    const moduleKey = option.dataset.module;
    if (moduleKey === getSelectedModule()) option.classList.add('workspace-option-current');
    option.addEventListener('click', () => {
      setSelectedModule(moduleKey);
      window.location.assign(getModuleLandingPage(moduleKey));
    });
  });
}
</script>
</body>
</html>
